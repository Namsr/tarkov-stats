[package]
name = "tarkov-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tarkov-ui = { path = "../ui", features = ["ssr"] }
leptos = { version = "=0.8.22", default-features = false, features = ["ssr", "islands"] }
leptos_axum = { version = "=0.8.10", default-features = false }
sha2 = "0.10.9"
percent-encoding = "2.3"
any_spawner = { version = "0.3.0", features = ["tokio"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
url = "2.5.8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
strip = true
