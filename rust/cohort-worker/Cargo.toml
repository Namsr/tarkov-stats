[package]
name = "tarkov-cohort-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "array"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
strip = true
