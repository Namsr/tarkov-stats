name: Operator Rust population image pair proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASELINE_REVISION: 0e5254526f3f1ecd9e4f28d85053090f0a0e7b77
      CANDIDATE_REVISION: 657642fa096a89e324108018b84f22bbd3bfff24
    steps:
      - name: Create evidence directory
        run: mkdir "$RUNNER_TEMP/population-pair-evidence"
      - name: Check out baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0e5254526f3f1ecd9e4f28d85053090f0a0e7b77
          path: sources/baseline
          persist-credentials: false
      - name: Check out candidate and driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 657642fa096a89e324108018b84f22bbd3bfff24
          path: sources/candidate
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify exact clean sources and driver
        working-directory: sources/candidate
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/population-pair-evidence"
          for role in baseline candidate; do
            if [[ $role == baseline ]]; then revision=$BASELINE_REVISION; else revision=$CANDIDATE_REVISION; fi
            source="$GITHUB_WORKSPACE/sources/$role"
            actual=$(git -C "$source" rev-parse HEAD)
            [[ $actual == "$revision" ]]
            [[ -z $(git -C "$source" status --porcelain --untracked-files=all) ]]
            printf '%s %s\n' "$role" "$actual" >> "$evidence/source-revisions.txt"
          done
          bash -n scripts/benchmark-rust-population-image-pair-container.sh
          node --experimental-strip-types --experimental-sqlite --test tests/rust-persistent-http-benchmark.test.mjs
      - name: Build both pinned production images and identify their workers
        timeout-minutes: 54
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/population-pair-evidence"
          docker_binary=$(command -v docker)
          docker() { timeout --signal=TERM --kill-after=5s 15s "$docker_binary" --context default "$@"; }
          endpoint=$(docker context inspect default --format '{{(index .Endpoints "docker").Host}}')
          [[ $endpoint == unix://* ]] || { echo 'Remote Docker endpoint refused.' >&2; exit 2; }
          token=$(tr -d '-' < /proc/sys/kernel/random/uuid)
          [[ $token =~ ^[0-9a-f]{32}$ ]] || exit 2
          active_id=''
          active_name=''
          worker_file=''
          cleanup() {
            if [[ -n $worker_file ]]; then rm -f -- "$worker_file"; worker_file=''; fi
            if [[ -z $active_id && -n $active_name ]]; then
              found=$(docker inspect "$active_name" --format '{{index .Config.Labels "org.tarkovstats.population-proof"}} {{.Id}}' 2>/dev/null || true)
              read -r owner found_id <<< "$found"
              if [[ $owner == "$token" && $found_id =~ ^[0-9a-f]{64}$ ]]; then active_id=$found_id; fi
            fi
            if [[ -n $active_id ]] && docker rm --force "$active_id" >/dev/null 2>&1; then active_id=''; active_name=''; fi
            if [[ -n $active_id || -n $active_name ]]; then
              printf '%s\n' 'owned container cleanup unconfirmed' > "$evidence/extraction-cleanup.txt"
              return 1
            fi
            printf '%s\n' 'no owned container remains' > "$evidence/extraction-cleanup.txt"
          }
          trap 'cleanup || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          for role in baseline candidate; do
            if [[ $role == baseline ]]; then revision=$BASELINE_REVISION; else revision=$CANDIDATE_REVISION; fi
            source="$GITHUB_WORKSPACE/sources/$role"
            iidfile="$evidence/$role-image-id.txt"
            timeout --signal=TERM --kill-after=10s 1500s "$docker_binary" --context default build \
              --iidfile "$iidfile" --build-arg "SOURCE_REVISION=$revision" "$source" 2>&1 | tee "$evidence/$role-build.log"
            image_id=$(cat "$iidfile")
            [[ $image_id =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ $(docker image inspect "$image_id" --format '{{.Id}}') == "$image_id" ]]
            [[ $(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "$revision" ]]
            active_name="rust-population-image-extract-$role-$token"
            if ! created_id=$(docker create --pull never --name "$active_name" --label "org.tarkovstats.population-proof=$token" "$image_id"); then
              echo 'Create failed; recovering only by owned name.' >&2; exit 2
            fi
            [[ $created_id =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid create result; recovering only by owned name.' >&2; exit 2; }
            active_id=$created_id
            worker_file="$evidence/$role-worker.tmp"
            docker cp "$active_id:/app/rust/cohort-worker/target/release/tarkov-cohort-worker" "$worker_file"
            worker_sha=$(sha256sum "$worker_file" | cut -d' ' -f1)
            [[ $worker_sha =~ ^[0-9a-f]{64}$ ]]
            printf '%s\n' "$worker_sha" > "$evidence/$role-worker.sha256"
            cleanup
          done
      - name: Compare four isolated Rust image runs
        timeout-minutes: 28
        working-directory: sources/candidate
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/population-pair-evidence"
          [[ $(cat "$evidence/extraction-cleanup.txt") == 'no owned container remains' ]]
          bash scripts/benchmark-rust-population-image-pair-container.sh \
            --baseline "$(cat "$evidence/baseline-image-id.txt")" \
            --candidate "$(cat "$evidence/candidate-image-id.txt")" \
            --baseline-revision "$BASELINE_REVISION" --candidate-revision "$CANDIDATE_REVISION" \
            --baseline-sha "$(cat "$evidence/baseline-worker.sha256")" \
            --candidate-sha "$(cat "$evidence/candidate-worker.sha256")" \
            --rows 30000 --iterations 20 --output "$RUNNER_TEMP/population-pair-runs"
      - name: Save observations, provenance and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-population-image-pair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/population-pair-evidence/*.txt
            ${{ runner.temp }}/population-pair-evidence/*.log
            ${{ runner.temp }}/population-pair-evidence/*.sha256
            ${{ runner.temp }}/population-pair-runs/*.json
            ${{ runner.temp }}/population-pair-runs/*.log
            ${{ runner.temp }}/population-pair-runs/*.txt
            ${{ runner.temp }}/population-pair-runs/*.sha256
            ${{ runner.temp }}/population-pair-runs/*.md
          if-no-files-found: warn
          retention-days: 14
