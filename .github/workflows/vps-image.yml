name: VPS image

on:
  push:
    branches: [main, 'codex/vps-load-reduction']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the production image
        run: docker build --build-arg "SOURCE_REVISION=$GITHUB_SHA" --tag "tarkovstats-web:$GITHUB_SHA" .
      - name: Verify the runtime image
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "tarkovstats-web:$GITHUB_SHA")" = "$GITHUB_SHA"
          docker run --rm --network none --entrypoint node "tarkovstats-web:$GITHUB_SHA" --experimental-strip-types --experimental-sqlite -e "require('node:sqlite'); require('node:fs').accessSync('/app/server.js')"
          docker run --detach --network none --name image-smoke "tarkovstats-web:$GITHUB_SHA"
          trap 'docker logs image-smoke; docker rm --force image-smoke' EXIT
          docker exec image-smoke node -e '
            (async () => {
              for (let attempt = 0; attempt < 30; attempt++) {
                try { if ((await fetch("http://127.0.0.1:3000/healthz")).status === 200) return; } catch {}
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              process.exit(1);
            })()'
      - name: Publish a revision-specific image
        if: github.event_name != 'pull_request'
        run: |
          tag="container-$GITHUB_SHA"
          # Published assets are never overwritten. Failed draft uploads can retry.
          if gh release view "$tag" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo "Image already published for $GITHUB_SHA"
            exit 0
          fi
          docker image save "tarkovstats-web:$GITHUB_SHA" | gzip -1 > web.tar.gz
          sha256sum web.tar.gz > web.tar.gz.sha256
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "VPS image $GITHUB_SHA" --notes "Production Docker image built by GitHub Actions from $GITHUB_SHA."
          fi
          gh release upload "$tag" web.tar.gz web.tar.gz.sha256 --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
