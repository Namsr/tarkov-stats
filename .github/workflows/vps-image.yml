name: Operator Seasonal synthetic resource proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_REVISION: 14490e2039a135e312a5d1b5f3d73f474887c3bc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and evidence validator
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_REVISION" -- app/api/average/cohort/route.ts app/api/seasonal/cohort/route.ts tests/fixtures/rust-cohort-data.mjs tests/fixtures/rust-arena-seasonal-data.mjs tests/fixtures/next-cache-shim.mjs tests/fixtures/next-server-entry.mjs scripts/benchmark-rust-cohort.mjs scripts/benchmark-worker-resources.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
          node --test scripts/test-seasonal-resource-proof.mjs
          bash -n scripts/benchmark-seasonal-resource-proof.sh
      - name: Download and verify the pinned release archive
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint=$(timeout --signal=TERM --kill-after=5s 15s docker --context default context inspect default --format '{{(index .Endpoints "docker").Host}}')
          [[ $endpoint == unix://* ]] || { echo 'Remote Docker endpoint refused.' >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/seasonal-image"
          cd "$RUNNER_TEMP/seasonal-image"
          timeout --signal=TERM --kill-after=10s 120s gh release download "container-$SOURCE_REVISION" --pattern web.tar.gz --pattern web.tar.gz.sha256
          expected=$(awk '$2 == "web.tar.gz" { print $1 }' web.tar.gz.sha256)
          [[ $expected == 3a4342c382b49821e2d37aab634c3435595ce967e6b798134a485e8dcae97ebb ]]
          printf '%s  web.tar.gz\n' "$expected" | sha256sum --check
          timeout --signal=TERM --kill-after=10s 100s docker --context default load --input web.tar.gz
          echo "PROOF_ARCHIVE_SHA256=$expected" >> "$GITHUB_ENV"
      - name: Compare Seasonal cohort workloads in four isolated containers
        timeout-minutes: 35
        run: bash scripts/benchmark-seasonal-resource-proof.sh "$RUNNER_TEMP/seasonal-resource-proof"
      - name: Save observations and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seasonal-resource-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seasonal-resource-proof/*.json
            ${{ runner.temp }}/seasonal-resource-proof/*.log
            ${{ runner.temp }}/seasonal-resource-proof/*.sha256
            ${{ runner.temp }}/seasonal-resource-proof/*.patch
            ${{ runner.temp }}/seasonal-resource-proof/summary.md
          if-no-files-found: warn
          retention-days: 14
