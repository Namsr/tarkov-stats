# Install as /etc/systemd/system/tarkovstats-deploy.service.d/limited-builder.conf
# Without this drop-in the deploy wrapper never reclaims the limited builder.
# The units run ops/deploy.sh as /usr/local/sbin/tarkovstats-deploy and
# ops/profile-queue.sh as /usr/local/sbin/tarkovstats-profile-queue.
[Service]
Environment=BUILDX_BUILDER=tarkovstats-limited
