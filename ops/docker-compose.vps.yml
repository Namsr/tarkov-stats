# Боевой деплой на VPS: web (Next.js) за Caddy (TLS + reverse proxy).
# Секреты НЕ инлайнятся — берутся из .env рядом с этим файлом (env_file).
# Запуск: docker compose -f docker-compose.vps.yml up -d --build
services:
  web:
    build:
      context: .
    env_file:
      - .env
      - .env.private
    restart: unless-stopped
    expose:
      - "3000"
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # FS только для чтения, кроме явных точек записи:
    #   /data (volume) — players.db; /tmp и /app/.next/cache (ISR) — tmpfs.
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001,mode=0700
    mem_limit: 1024m
    oom_score_adj: -500
    pids_limit: 256
    volumes:
      - players_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    environment:
      # Leave 64 MiB for sockets, binary pages and other non-Go memory.
      # Go's limit is soft; proxy concurrency is also bounded in ops/Caddyfile.
      GOMEMLIMIT: 192MiB
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Нужна только для bind на привилегированные 80/443.
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  players_data:
  caddy_data:
  caddy_config:
