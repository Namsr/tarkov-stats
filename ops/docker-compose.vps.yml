# Боевой деплой на VPS: web (Next.js) за Caddy (TLS + reverse proxy).
# Секреты НЕ инлайнятся — берутся из .env рядом с этим файлом (env_file).
# Деплой загружает готовый образ из GitHub Actions; build оставлен для ручной сборки.
services:
  web:
    image: tarkovstats-web:latest
    pull_policy: never
    build:
      context: .
    env_file:
      - .env
      - .env.private
    environment:
      WEB_BACKGROUND_WORKERS: "false"
    restart: unless-stopped
    expose:
      - "3000"
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # FS только для чтения, кроме явных точек записи:
    #   /data (volume) — players.db; /tmp и /app/.next/cache (ISR) — tmpfs.
    # Страницы tmpfs входят в mem_limit cgroup, поэтому размер ограничен: при
    # переполнении запись в кэш Next падает с ошибкой, её ловит IncrementalCache.set
    # (console.warn), и запрос становится cache miss, а не OOM-kill контейнера.
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1001,gid=1001,mode=0700,size=256m
    # 896 + 512 (all background containers) + 256 (Caddy) = 1664 MiB.
    # The remaining ~303 MiB on this 1967 MiB VPS belongs to the host.
    mem_limit: 896m
    mem_reservation: 384m
    memswap_limit: 1152m
    oom_score_adj: -500
    pids_limit: 256
    volumes:
      - players_data:/data
    logging:
      # Host journal survives container recreation; its size is capped in
      # ops/systemd/journald-tarkovstats.conf. No environment metadata is added.
      driver: journald
      options:
        tag: tarkovstats-web
        labels: org.opencontainers.image.revision
        mode: non-blocking
        max-buffer-size: "1m"

  # One-shot jobs share the deployed image and data, never HTTP's cgroup.
  # Install/start ops/systemd/tarkovstats-background.slice before enabling jobs.
  worker:
    image: ${TARKOVSTATS_WORKER_IMAGE:-tarkovstats-web:latest}
    pull_policy: never
    profiles: ["background"]
    env_file:
      - .env
      - .env.private
    environment:
      WEB_BACKGROUND_WORKERS: "false"
      # Collectors and warmup call HTTP in the separate web container.
      REGULAR_PROFILE_SYNC_BASE_URL: "http://web:3000"
      PVE_PROFILE_SYNC_BASE_URL: "http://web:3000"
      ARENA_PROFILE_SYNC_BASE_URL: "http://web:3000"
      SEASONAL_PROFILE_SYNC_BASE_URL: "http://web:3000"
      LEADERBOARD_WARMUP_BASE_URL: "http://web:3000"
    command: ["node", "--version"]
    restart: "no"
    cgroup_parent: tarkovstats-background.slice
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1001,gid=1001,mode=0700,size=16m
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.5
    cpu_shares: 128
    pids_limit: 128
    volumes:
      - players_data:/data
    logging:
      driver: journald
      options:
        tag: tarkovstats-background
        labels: org.opencontainers.image.revision
        mode: non-blocking
        max-buffer-size: "1m"

  caddy:
    image: caddy:2-alpine
    environment:
      # Leave 64 MiB for sockets, binary pages and other non-Go memory.
      # Go's limit is soft; proxy concurrency is also bounded in ops/Caddyfile.
      GOMEMLIMIT: 192MiB
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Нужна только для bind на привилегированные 80/443.
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging:
      driver: journald
      options:
        tag: tarkovstats-caddy
        mode: non-blocking
        max-buffer-size: "1m"

volumes:
  players_data:
  caddy_data:
  caddy_config:
